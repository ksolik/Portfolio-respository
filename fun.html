    <script>
      // Utility to detect mobile
      function isMobile() {
        return window.innerWidth <= 600;
      }

      // Masonry layout function (unchanged)
      function layoutMasonry(container, cols) {
        const items = Array.from(container.querySelectorAll(".masonry-item"));
        const heights = Array(cols).fill(0);
        const colW = container.clientWidth / cols;
        items.forEach((item) => {
          const img = item.querySelector("img");
          const h = (colW * img.naturalHeight) / img.naturalWidth;
          const col = heights.indexOf(Math.min(...heights));
          Object.assign(item.style, {
            position: "absolute",
            width: colW + "px",
            height: h + "px",
            left: col * colW + "px",
            top: heights[col] + "px",
          });
          heights[col] += h;
        });
        container.style.height = Math.max(...heights) + "px";
      }

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".dropdown-toggle").forEach((toggle) => {
          const content = toggle.nextElementSibling;
          toggle.addEventListener("click", () => {
            const isOpen = content.classList.toggle("open");
            // toggle active for arrow rotation on mobile
            toggle.classList.toggle("active", isOpen);

            if (isMobile()) {
              // smooth mobile expand/collapse
              content.style.maxHeight = isOpen
                ? content.scrollHeight + "px"
                : "0";
              return;
            }

            // desktop behavior
            if (isOpen) {
              content.style.maxHeight = content.scrollHeight + "px";
              layoutMasonry(content, 3);
            } else {
              content.style.maxHeight = "0";
            }
          });
        });
      });

      window.addEventListener("resize", () => {
        document
          .querySelectorAll(".dropdown-content.open")
          .forEach((content) => {
            if (!isMobile()) {
              content.style.maxHeight = content.scrollHeight + "px";
              layoutMasonry(content, 3);
            }
          });
      });
    </script>
